<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Studio — Mistral & DeepSeek</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600&display=swap" rel="stylesheet">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  body {
    font-family: 'Inter', sans-serif;
    background: #f9fafb;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .app-header {
    background: white;
    border-bottom: 1px solid #e5e7eb;
    padding: 12px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }
  .logo {
    font-weight: 700;
    font-size: 1.4rem;
    background: linear-gradient(135deg, #3b82f6, #8b5cf6);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .badge {
    font-size: 0.7rem;
    background: #eef2ff;
    padding: 4px 8px;
    border-radius: 20px;
    color: #3b82f6;
  }
  .header-controls {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
  }
  select, button {
    font-family: inherit;
    background: white;
    border: 1px solid #e5e7eb;
    padding: 6px 12px;
    border-radius: 30px;
    font-size: 0.8rem;
    cursor: pointer;
  }
  button.primary {
    background: #3b82f6;
    color: white;
    border: none;
  }
  .status {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 0.75rem;
    background: #f3f4f6;
    padding: 4px 10px;
    border-radius: 30px;
  }
  .status-dot {
    width: 8px;
    height: 8px;
    background: #9ca3af;
    border-radius: 50%;
  }
  .status.online .status-dot {
    background: #10b981;
  }
  .chat-container {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .message {
    max-width: 75%;
    padding: 10px 16px;
    border-radius: 20px;
    font-size: 0.9rem;
    line-height: 1.4;
  }
  .message.user {
    align-self: flex-end;
    background: #3b82f6;
    color: white;
    border-bottom-right-radius: 4px;
  }
  .message.assistant {
    align-self: flex-start;
    background: white;
    border: 1px solid #e5e7eb;
    border-bottom-left-radius: 4px;
  }
  .input-area {
    background: white;
    border-top: 1px solid #e5e7eb;
    padding: 16px 24px;
    display: flex;
    gap: 12px;
    align-items: flex-end;
  }
  textarea {
    flex: 1;
    border: 1px solid #e5e7eb;
    border-radius: 24px;
    padding: 10px 16px;
    font-family: inherit;
    resize: none;
    font-size: 0.9rem;
  }
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    backdrop-filter: blur(3px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
  }
  .modal {
    background: white;
    border-radius: 28px;
    width: 90%;
    max-width: 500px;
    padding: 24px;
    max-height: 80vh;
    overflow-y: auto;
  }
  .field-group {
    margin-bottom: 16px;
  }
  label {
    font-weight: 500;
    font-size: 0.8rem;
    display: block;
    margin-bottom: 6px;
  }
  input, textarea, select {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #e5e7eb;
    border-radius: 16px;
    font-family: inherit;
  }
  .btn-group {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 20px;
  }
  .toast {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: #1f2937;
    color: white;
    padding: 10px 16px;
    border-radius: 40px;
    font-size: 0.8rem;
    z-index: 1100;
  }
</style>
</head>
<body>

<header class="app-header">
  <div><span class="logo">✦ AI Studio</span> <span class="badge">Mistral / DeepSeek</span></div>
  <div class="header-controls">
    <select id="provider-select">
      <option value="mistral">Mistral AI</option>
      <option value="deepseek">DeepSeek</option>
    </select>
    <select id="model-select"></select>
    <select id="agent-select"><option value="">No agent</option></select>
    <button id="new-chat">+ New chat</button>
    <button id="clear-chat">Clear</button>
    <span class="status" id="api-status"><span class="status-dot"></span> Offline</span>
    <button id="open-api-modal" class="primary">API Key</button>
    <button id="open-agent-modal">Agents</button>
    <button id="open-data-modal">Data</button>
  </div>
</header>

<div class="chat-container" id="chat-container"></div>

<div class="input-area">
  <textarea id="user-input" rows="1" placeholder="Votre message... (Entrée pour envoyer)"></textarea>
  <button id="send-btn" class="primary">Envoyer</button>
</div>

<!-- Modals -->
<div id="api-modal" class="modal-overlay" style="display:none">
  <div class="modal">
    <h3>🔑 Configuration API</h3>
    <div class="field-group">
      <label>Fournisseur</label>
      <select id="modal-provider"><option value="mistral">Mistral AI</option><option value="deepseek">DeepSeek</option></select>
    </div>
    <div class="field-group">
      <label>Clé API</label>
      <input type="password" id="api-key-input" placeholder="Votre clé">
    </div>
    <div class="btn-group">
      <button id="close-api-modal">Annuler</button>
      <button id="save-api-key" class="primary">Enregistrer & Tester</button>
    </div>
  </div>
</div>

<div id="agent-modal" class="modal-overlay" style="display:none">
  <div class="modal">
    <h3>⚙️ Agents</h3>
    <div id="agent-list"></div>
    <hr>
    <div class="field-group"><label>Nom</label><input id="agent-name"></div>
    <div class="field-group"><label>Rôle</label><textarea id="agent-desc" rows="2"></textarea></div>
    <div class="field-group"><label>Instructions</label><textarea id="agent-instructions" rows="3"></textarea></div>
    <div class="btn-group"><button id="close-agent-modal">Fermer</button><button id="save-agent" class="primary">Créer</button></div>
  </div>
</div>

<div id="data-modal" class="modal-overlay" style="display:none">
  <div class="modal">
    <h3>📁 Données</h3>
    <button id="export-data">📥 Exporter tout</button><br><br>
    <input type="file" id="import-file"><br><br>
    <button id="import-data">📤 Importer</button><br><br>
    <button id="clear-all-data" style="color:red">⚠️ Supprimer toutes les données</button>
    <div class="btn-group"><button id="close-data-modal">Fermer</button></div>
  </div>
</div>

<!-- Wizard de bienvenue -->
<div id="wizard" class="modal-overlay" style="display:flex">
  <div class="modal">
    <h2>👋 Bienvenue</h2>
    <p>Configurez votre IA (Mistral ou DeepSeek).</p>
    <div class="field-group">
      <label>🔑 Clé API</label>
      <input type="password" id="wizard-key" placeholder="sk-...">
    </div>
    <div class="field-group">
      <label>Fournisseur</label>
      <select id="wizard-provider">
        <option value="mistral">Mistral AI</option>
        <option value="deepseek">DeepSeek</option>
      </select>
    </div>
    <div class="field-group">
      <label>Nom de votre IA</label>
      <input id="wizard-name" placeholder="ex: Assistant Pro">
    </div>
    <div class="field-group">
      <label>Votre objectif principal</label>
      <textarea id="wizard-goal" rows="3" placeholder="Je suis développeur, j'ai besoin d'aide pour le code..."></textarea>
    </div>
    <div class="btn-group">
      <button id="wizard-finish" class="primary">Démarrer</button>
    </div>
  </div>
</div>

<div id="toast-area" style="position:fixed; bottom:20px; right:20px; z-index:2000"></div>

<script>
  // ---------- CONFIG ----------
  const PROVIDERS = {
    mistral: { name: "Mistral", endpoint: "https://api.mistral.ai/v1/chat/completions", defaultModel: "mistral-small-latest", models: ["mistral-small-latest","mistral-medium-latest","codestral-latest"] },
    deepseek: { name: "DeepSeek", endpoint: "https://api.deepseek.com/v1/chat/completions", defaultModel: "deepseek-chat", models: ["deepseek-chat","deepseek-coder"] }
  };

  let state = {
    provider: "mistral",
    apiKey: null,
    model: "mistral-small-latest",
    chatId: null,
    messages: [],
    agent: null,
    globalMemories: [],
    aiName: "AI Studio",
    aiGoal: ""
  };

  // IndexedDB
  let db;
  function openDB() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open("AIStudioDB", 1);
      req.onupgradeneeded = (e) => {
        const d = e.target.result;
        if (!d.objectStoreNames.contains("chats")) d.createObjectStore("chats", { keyPath: "id" });
        if (!d.objectStoreNames.contains("agents")) d.createObjectStore("agents", { keyPath: "id" });
        if (!d.objectStoreNames.contains("memory")) d.createObjectStore("memory", { keyPath: "id" });
        if (!d.objectStoreNames.contains("settings")) d.createObjectStore("settings", { keyPath: "id" });
      };
      req.onsuccess = () => { db = req.result; resolve(db); };
      req.onerror = (e) => reject(e);
    });
  }

  async function getSetting(key) {
    return new Promise((res) => {
      const tx = db.transaction("settings", "readonly");
      const get = tx.objectStore("settings").get(key);
      get.onsuccess = () => res(get.result?.value);
    });
  }
  async function setSetting(key, value) {
    return new Promise((res) => {
      const tx = db.transaction("settings", "readwrite");
      tx.objectStore("settings").put({ id: key, value });
      tx.oncomplete = res;
    });
  }

  async function getAll(store) {
    return new Promise((res) => {
      const tx = db.transaction(store, "readonly");
      const req = tx.objectStore(store).getAll();
      req.onsuccess = () => res(req.result || []);
    });
  }
  async function putOne(store, data) {
    return new Promise((res) => {
      const tx = db.transaction(store, "readwrite");
      tx.objectStore(store).put(data);
      tx.oncomplete = res;
    });
  }
  async function deleteOne(store, id) {
    return new Promise((res) => {
      const tx = db.transaction(store, "readwrite");
      tx.objectStore(store).delete(id);
      tx.oncomplete = res;
    });
  }

  // ---------- UI Helpers ----------
  function toast(msg, type = "info") {
    const div = document.createElement("div");
    div.className = "toast";
    div.innerText = msg;
    document.getElementById("toast-area").appendChild(div);
    setTimeout(() => div.remove(), 3000);
  }

  function updateApiStatus() {
    const el = document.getElementById("api-status");
    if (state.apiKey) {
      el.innerHTML = `<span class="status-dot"></span> Online (${state.provider})`;
      el.classList.add("online");
    } else {
      el.innerHTML = `<span class="status-dot"></span> Offline`;
      el.classList.remove("online");
    }
  }

  // ---------- Memory ----------
  async function loadMemory() {
    const all = await getAll("memory");
    state.globalMemories = all;
    renderMemoryPanel();
  }
  async function addMemory(content) {
    const mem = { id: crypto.randomUUID(), content, created: Date.now() };
    await putOne("memory", mem);
    state.globalMemories.push(mem);
    renderMemoryPanel();
    toast("Mémoire ajoutée");
  }
  async function deleteMemory(id) {
    await deleteOne("memory", id);
    state.globalMemories = state.globalMemories.filter(m => m.id !== id);
    renderMemoryPanel();
  }
  function renderMemoryPanel() {
    const container = document.getElementById("memory-panel");
    if (!container) return;
    container.innerHTML = state.globalMemories.slice(-10).map(m => `<div style="display:flex; justify-content:space-between; padding:6px 0"><span>${escapeHtml(m.content)}</span><button onclick="window.deleteMemory('${m.id}')">✕</button></div>`).join('');
  }
  window.deleteMemory = deleteMemory;

  // ---------- Agents ----------
  async function loadAgents() {
    const agents = await getAll("agents");
    const sel = document.getElementById("agent-select");
    sel.innerHTML = '<option value="">No agent</option>';
    agents.forEach(a => {
      const opt = document.createElement("option");
      opt.value = a.id;
      opt.textContent = a.name;
      sel.appendChild(opt);
    });
    const listDiv = document.getElementById("agent-list");
    if (listDiv) {
      listDiv.innerHTML = agents.map(a => `<div style="display:flex; justify-content:space-between; margin-bottom:8px"><b>${escapeHtml(a.name)}</b><div><button onclick="activateAgent('${a.id}')">Utiliser</button> <button onclick="deleteAgent('${a.id}')" style="color:red">Suppr</button></div></div>`).join('');
    }
  }
  window.activateAgent = async (id) => {
    const agents = await getAll("agents");
    const agent = agents.find(a => a.id === id);
    if (agent) {
      state.agent = agent;
      toast(`Agent "${agent.name}" activé`);
      const sysMsg = state.messages.find(m => m.role === "system");
      if (sysMsg) sysMsg.content = buildSystemPrompt();
      await saveCurrentChat();
      renderMessages();
    }
  };
  window.deleteAgent = async (id) => {
    await deleteOne("agents", id);
    if (state.agent?.id === id) state.agent = null;
    await loadAgents();
    toast("Agent supprimé");
  };
  async function createAgent(name, desc, instructions) {
    const agent = { id: crypto.randomUUID(), name, desc, instructions, created: Date.now() };
    await putOne("agents", agent);
    await loadAgents();
    toast(`Agent "${name}" créé`);
  }

  // ---------- Chat ----------
  function buildSystemPrompt() {
    let prompt = `Tu es ${state.aiName || "un assistant IA"}, utile, précis et bienveillant. Objectif de l'utilisateur : ${state.aiGoal || "aucun défini"}.`;
    if (state.agent) {
      prompt = `[Agent: ${state.agent.name}] ${state.agent.desc || ""}\nInstructions: ${state.agent.instructions || ""}\n` + prompt;
    }
    const memories = state.globalMemories.slice(-4).map(m => m.content).join("\n");
    if (memories) prompt += `\nMémoires pertinentes :\n${memories}`;
    return prompt;
  }

  async function newChat() {
    state.chatId = crypto.randomUUID();
    state.messages = [{ role: "system", content: buildSystemPrompt(), ts: Date.now() }];
    await saveCurrentChat();
    renderMessages();
  }

  async function saveCurrentChat() {
    if (!state.chatId) return;
    const chat = {
      id: state.chatId,
      model: state.model,
      agentId: state.agent?.id,
      messages: state.messages,
      title: state.messages.find(m => m.role === "user")?.content?.slice(0, 40) || "Nouveau chat",
      updated: Date.now()
    };
    await putOne("chats", chat);
    renderArchives();
  }

  async function loadChat(chatId) {
    const chats = await getAll("chats");
    const chat = chats.find(c => c.id === chatId);
    if (!chat) return;
    state.chatId = chat.id;
    state.messages = chat.messages;
    state.model = chat.model;
    document.getElementById("model-select").value = state.model;
    if (chat.agentId) {
      const agents = await getAll("agents");
      state.agent = agents.find(a => a.id === chat.agentId);
    } else state.agent = null;
    renderMessages();
    toast("Conversation chargée");
  }

  function renderMessages() {
    const container = document.getElementById("chat-container");
    const msgs = state.messages.filter(m => m.role !== "system");
    if (msgs.length === 0) {
      container.innerHTML = `<div style="text-align:center;padding:40px;color:#6b7280">✨ Commencez à discuter !</div>`;
      return;
    }
    container.innerHTML = msgs.map(m => `
      <div class="message ${m.role}">
        <div>${escapeHtml(m.content)}</div>
        <div style="font-size:10px; opacity:0.6; margin-top:4px">${new Date(m.ts).toLocaleTimeString()}</div>
      </div>
    `).join('');
    container.scrollTop = container.scrollHeight;
  }

  async function sendMessage() {
    const input = document.getElementById("user-input").value.trim();
    if (!input) return;
    if (!state.apiKey) {
      toast("Veuillez configurer votre clé API d'abord", "error");
      document.getElementById("api-modal").style.display = "flex";
      return;
    }
    // Ajouter message user
    state.messages.push({ role: "user", content: input, ts: Date.now() });
    renderMessages();
    document.getElementById("user-input").value = "";
    document.getElementById("send-btn").disabled = true;

    await saveCurrentChat();

    // Préparer appel API
    const systemPrompt = buildSystemPrompt();
    const context = [
      { role: "system", content: systemPrompt },
      ...state.messages.slice(-12).map(m => ({ role: m.role, content: m.content }))
    ];

    const provider = PROVIDERS[state.provider];
    const endpoint = provider.endpoint;

    try {
      const response = await fetch(endpoint, {
        method: "POST",
        headers: {
          "Authorization": `Bearer ${state.apiKey}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          model: state.model,
          messages: context,
          temperature: 0.7,
          max_tokens: 1024
        })
      });

      if (!response.ok) {
        const errText = await response.text();
        throw new Error(`API error (${response.status}): ${errText.slice(0, 100)}`);
      }

      const data = await response.json();
      const reply = data.choices[0].message.content;
      state.messages.push({ role: "assistant", content: reply, ts: Date.now() });
      renderMessages();
      await saveCurrentChat();
    } catch (err) {
      toast(`Erreur: ${err.message}`, "error");
      state.messages.push({ role: "assistant", content: `⚠️ ${err.message}`, ts: Date.now() });
      renderMessages();
    } finally {
      document.getElementById("send-btn").disabled = false;
    }
  }

  // ---------- Archives ----------
  async function renderArchives() {
    const chats = await getAll("chats");
    const sorted = chats.sort((a,b) => b.updated - a.updated);
    const container = document.getElementById("archives-list");
    if (!container) return;
    if (sorted.length === 0) {
      container.innerHTML = "<div style='padding:12px; color:gray'>Aucune conversation</div>";
      return;
    }
    container.innerHTML = sorted.map(c => `
      <div style="display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid #f0f0f0">
        <span style="cursor:pointer" onclick="loadChat('${c.id}')">${escapeHtml(c.title || "Sans titre")}</span>
        <button onclick="deleteChat('${c.id}')" style="color:red">✕</button>
      </div>
    `).join('');
  }
  window.deleteChat = async (id) => {
    await deleteOne("chats", id);
    if (state.chatId === id) await newChat();
    await renderArchives();
    toast("Conversation supprimée");
  };

  // ---------- Data export/import ----------
  async function exportAll() {
    const chats = await getAll("chats");
    const agents = await getAll("agents");
    const memory = await getAll("memory");
    const blob = new Blob([JSON.stringify({ chats, agents, memory })], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `backup-${new Date().toISOString()}.json`;
    a.click();
    toast("Export terminé");
  }
  async function importData(file) {
    const text = await file.text();
    const data = JSON.parse(text);
    if (data.chats) for (const c of data.chats) await putOne("chats", c);
    if (data.agents) for (const a of data.agents) await putOne("agents", a);
    if (data.memory) for (const m of data.memory) await putOne("memory", m);
    toast("Import réussi");
    await loadMemory();
    await loadAgents();
    await renderArchives();
  }

  // ---------- Wizard & API test ----------
  async function testApiKey(provider, apiKey, model) {
    const prov = PROVIDERS[provider];
    const res = await fetch(prov.endpoint, {
      method: "POST",
      headers: { "Authorization": `Bearer ${apiKey}`, "Content-Type": "application/json" },
      body: JSON.stringify({
        model: model,
        messages: [{ role: "user", content: "Say 'OK' in one word" }],
        max_tokens: 5
      })
    });
    return res.ok;
  }

  async function finishWizard() {
    const key = document.getElementById("wizard-key").value.trim();
    const provider = document.getElementById("wizard-provider").value;
    const name = document.getElementById("wizard-name").value.trim() || "AI Studio";
    const goal = document.getElementById("wizard-goal").value.trim();

    if (!key) {
      toast("Veuillez entrer une clé API", "error");
      return;
    }

    // Tester la clé
    toast("Test de la clé API...");
    const defaultModel = PROVIDERS[provider].defaultModel;
    const isValid = await testApiKey(provider, key, defaultModel);
    if (!isValid) {
      toast("Clé invalide ou erreur réseau. Vérifiez votre clé et le fournisseur.", "error");
      return;
    }

    // Sauvegarde
    state.apiKey = key;
    state.provider = provider;
    state.aiName = name;
    state.aiGoal = goal;
    localStorage.setItem("api_key", key);
    localStorage.setItem("provider", provider);
    await setSetting("aiConfig", { name, goal });
    updateApiStatus();

    // Charger modèles du fournisseur
    const modelSelect = document.getElementById("model-select");
    modelSelect.innerHTML = PROVIDERS[provider].models.map(m => `<option value="${m}" ${m === defaultModel ? "selected" : ""}>${m}</option>`).join('');
    state.model = defaultModel;

    // Cacher wizard
    document.getElementById("wizard").style.display = "none";
    await newChat();
    toast("Prêt ! Vous pouvez discuter.");
  }

  // ---------- Initialisation ----------
  async function init() {
    await openDB();

    // Restaurer clé et provider depuis localStorage
    const savedKey = localStorage.getItem("api_key");
    const savedProvider = localStorage.getItem("provider");
    if (savedKey && savedProvider) {
      state.apiKey = savedKey;
      state.provider = savedProvider;
      updateApiStatus();
      // Charger les modèles
      const modelSelect = document.getElementById("model-select");
      modelSelect.innerHTML = PROVIDERS[state.provider].models.map(m => `<option value="${m}">${m}</option>`).join('');
      state.model = PROVIDERS[state.provider].defaultModel;
      modelSelect.value = state.model;
      // Récupérer config IA
      const cfg = await getSetting("aiConfig");
      if (cfg) { state.aiName = cfg.name; state.aiGoal = cfg.goal; }
      await loadMemory();
      await loadAgents();
      await renderArchives();
      await newChat();
      document.getElementById("wizard").style.display = "none";
    } else {
      // Wizard affiché
      document.getElementById("wizard").style.display = "flex";
    }

    // Event listeners
    document.getElementById("provider-select").onchange = (e) => {
      state.provider = e.target.value;
      const modelSelect = document.getElementById("model-select");
      modelSelect.innerHTML = PROVIDERS[state.provider].models.map(m => `<option value="${m}">${m}</option>`).join('');
      state.model = PROVIDERS[state.provider].defaultModel;
      modelSelect.value = state.model;
      localStorage.setItem("provider", state.provider);
    };
    document.getElementById("model-select").onchange = (e) => { state.model = e.target.value; };
    document.getElementById("send-btn").onclick = sendMessage;
    document.getElementById("user-input").onkeydown = (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); } };
    document.getElementById("new-chat").onclick = newChat;
    document.getElementById("clear-chat").onclick = async () => {
      state.messages = [{ role: "system", content: buildSystemPrompt(), ts: Date.now() }];
      await saveCurrentChat();
      renderMessages();
      toast("Conversation effacée");
    };
    document.getElementById("open-api-modal").onclick = () => { document.getElementById("api-modal").style.display = "flex"; };
    document.getElementById("close-api-modal").onclick = () => { document.getElementById("api-modal").style.display = "none"; };
    document.getElementById("save-api-key").onclick = async () => {
      const key = document.getElementById("api-key-input").value.trim();
      const provider = document.getElementById("modal-provider").value;
      if (!key) { toast("Clé vide"); return; }
      const ok = await testApiKey(provider, key, PROVIDERS[provider].defaultModel);
      if (!ok) { toast("Clé invalide"); return; }
      state.apiKey = key;
      state.provider = provider;
      localStorage.setItem("api_key", key);
      localStorage.setItem("provider", provider);
      updateApiStatus();
      document.getElementById("api-modal").style.display = "none";
      toast("Clé enregistrée et validée");
    };
    document.getElementById("open-agent-modal").onclick = async () => { await loadAgents(); document.getElementById("agent-modal").style.display = "flex"; };
    document.getElementById("close-agent-modal").onclick = () => { document.getElementById("agent-modal").style.display = "none"; };
    document.getElementById("save-agent").onclick = async () => {
      const name = document.getElementById("agent-name").value.trim();
      const desc = document.getElementById("agent-desc").value.trim();
      const instr = document.getElementById("agent-instructions").value.trim();
      if (!name || !desc) { toast("Nom et description requis"); return; }
      await createAgent(name, desc, instr);
      document.getElementById("agent-name").value = "";
      document.getElementById("agent-desc").value = "";
      document.getElementById("agent-instructions").value = "";
    };
    document.getElementById("open-data-modal").onclick = () => { document.getElementById("data-modal").style.display = "flex"; };
    document.getElementById("close-data-modal").onclick = () => { document.getElementById("data-modal").style.display = "none"; };
    document.getElementById("export-data").onclick = exportAll;
    document.getElementById("import-data").onclick = () => {
      const file = document.getElementById("import-file").files[0];
      if (file) importData(file);
      else toast("Sélectionnez un fichier");
    };
    document.getElementById("clear-all-data").onclick = async () => {
      if (!confirm("Supprimer TOUTES les données ? Irréversible.")) return;
      const stores = ["chats", "agents", "memory", "settings"];
      for (const store of stores) {
        const items = await getAll(store);
        for (const item of items) await deleteOne(store, item.id);
      }
      state.messages = [];
      state.globalMemories = [];
      state.agent = null;
      await newChat();
      await loadMemory();
      await loadAgents();
      await renderArchives();
      toast("Toutes les données ont été supprimées");
    };
    document.getElementById("wizard-finish").onclick = finishWizard;

    // Panels mémoire / archives (simplifiés)
    const memPanel = document.createElement("div");
    memPanel.id = "memory-panel";
    memPanel.className = "modal-overlay";
    memPanel.style.display = "none";
    memPanel.innerHTML = `<div class="modal" style="max-width:400px"><h3>📚 Mémoire globale</h3><div id="memory-list"></div><div style="display:flex;gap:6px;margin-top:12px"><input id="memory-input" placeholder="Ajouter un souvenir"><button id="memory-add-btn">+</button></div><div class="btn-group"><button id="memory-close">Fermer</button></div></div>`;
    document.body.appendChild(memPanel);
    document.getElementById("memory-toggle")?.remove(); // on va utiliser un bouton simple
    const memoryBtn = document.createElement("button");
    memoryBtn.textContent = "📚 Mémoire";
    memoryBtn.className = "primary";
    memoryBtn.style.position = "fixed";
    memoryBtn.style.bottom = "20px";
    memoryBtn.style.right = "20px";
    memoryBtn.style.zIndex = "100";
    memoryBtn.onclick = () => { memPanel.style.display = "flex"; renderMemoryPanel(); };
    document.body.appendChild(memoryBtn);
    window.renderMemoryPanel = () => {
      const container = document.getElementById("memory-list");
      if (!container) return;
      container.innerHTML = state.globalMemories.slice(-10).map(m => `<div style="display:flex; justify-content:space-between"><span>${escapeHtml(m.content)}</span><button onclick="deleteMemory('${m.id}')">✕</button></div>`).join('');
    };
    document.getElementById("memory-add-btn")?.addEventListener("click", async () => {
      const val = document.getElementById("memory-input")?.value.trim();
      if (val) { await addMemory(val); document.getElementById("memory-input").value = ""; renderMemoryPanel(); }
    });
    document.getElementById("memory-close")?.addEventListener("click", () => { memPanel.style.display = "none"; });

    const archPanel = document.createElement("div");
    archPanel.id = "archives-panel";
    archPanel.className = "modal-overlay";
    archPanel.style.display = "none";
    archPanel.innerHTML = `<div class="modal" style="max-width:400px"><h3>💬 Archives</h3><div id="archives-list"></div><div class="btn-group"><button id="archives-close">Fermer</button></div></div>`;
    document.body.appendChild(archPanel);
    const archBtn = document.createElement("button");
    archBtn.textContent = "💬 Archives";
    archBtn.style.position = "fixed";
    archBtn.style.bottom = "20px";
    archBtn.style.left = "20px";
    archBtn.style.zIndex = "100";
    archBtn.onclick = async () => { await renderArchives(); archPanel.style.display = "flex"; };
    document.body.appendChild(archBtn);
    document.getElementById("archives-close")?.addEventListener("click", () => { archPanel.style.display = "none"; });
  }

  function escapeHtml(str) {
    return str.replace(/[&<>]/g, function(m) {
      if (m === '&') return '&amp;';
      if (m === '<') return '&lt;';
      if (m === '>') return '&gt;';
      return m;
    }).replace(/\n/g, "<br>");
  }

  init();
</script>
</body>
</html>
